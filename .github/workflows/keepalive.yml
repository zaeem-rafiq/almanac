# A-09: keeps the serverless host warm through the judging window so a cold start never eats
# the first request. Scoped to one day on purpose — this is not a permanent cron.
name: keepalive

on:
  schedule:
    # Every 10 minutes, 12:00-22:00 UTC on 8 September. The judging window is 09:00-17:00 ET,
    # which is 13:00-21:00 UTC in EDT; an hour of margin sits on each side.
    - cron: "*/10 12-22 8 9 *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Curl the live report endpoint
        env:
          ALMANAC_URL: ${{ vars.ALMANAC_URL }}
        run: |
          set -euo pipefail
          # Fail loudly rather than curling an empty URL and reporting a misleading green.
          if [ -z "${ALMANAC_URL:-}" ]; then
            echo "::error::repo variable ALMANAC_URL is not set — run: gh variable set ALMANAC_URL"
            exit 1
          fi
          # Warm the page a judge actually opens. This used to hit /api/report and require 200,
          # but reports/latest.json is a build artifact that only exists after a nightly run has
          # committed one — before that the endpoint correctly returns 503 and the keepalive job
          # would go red for a host that is perfectly healthy. / is the honest liveness signal;
          # /api/report is probed below for information, not as a gate.
          TARGET="${ALMANAC_URL%/}/"
          echo "GET ${TARGET}"
          CODE="$(curl --silent --show-error --location --max-time 60 \
                       --output /tmp/keepalive-body --write-out '%{http_code}' "${TARGET}")"
          echo "HTTP ${CODE}"
          head -c 400 /tmp/keepalive-body || true
          echo
          # Assert the size of what came back, not merely that a request happened: a 200 with an
          # empty body is a warm host serving nothing.
          BYTES="$(wc -c < /tmp/keepalive-body | tr -d ' ')"
          echo "body bytes: ${BYTES}"
          if [ "${CODE}" != "200" ]; then
            echo "::error::expected HTTP 200, got ${CODE}"
            exit 1
          fi
          if [ "${BYTES}" -lt 2 ]; then
            echo "::error::HTTP 200 but body is ${BYTES} bytes — host is up but serving nothing"
            exit 1
          fi
          # Informational: says whether a scan artifact has shipped yet. 503 here is a documented
          # state, not a failure, so it is reported and not gated on.
          REPORT_CODE="$(curl --silent --location --max-time 60 --output /dev/null \
                              --write-out '%{http_code}' "${ALMANAC_URL%/}/api/report")"
          echo "/api/report -> HTTP ${REPORT_CODE} (503 means no scan artifact deployed yet)"
