# A-09: the nightly scan. Runs while everyone sleeps, commits its own output.
#
# Cadence is deliberately nightly and no more often: `captions.download` costs 200 quota units
# per video, so a five-video YouTube scan is ~1,250 units against a 10,000/day budget. A more
# frequent schedule would exhaust the quota and start returning 403 mid-day.
name: nightly

on:
  schedule:
    # 07:00 UTC = 02:00 CT. Well clear of the YouTube quota reset at midnight Pacific.
    - cron: "0 7 * * *"
  workflow_dispatch:

# The job pushes a commit back to the branch, so it needs write access to contents.
permissions:
  contents: write

concurrency:
  group: almanac-nightly
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Refresh rates
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python -m almanac rates --refresh

      # The YouTube path needs owner OAuth. When YT_TOKEN_JSON is absent the job still has to
      # produce a report, so it falls back to the local corpus rather than failing. This is the
      # branch that actually executes while the daily quota is exhausted.
      - name: Choose scan source
        id: source
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          if [ -n "$YT_TOKEN_JSON" ]; then
            printf '%s' "$YT_TOKEN_JSON" | base64 --decode > token.json
            echo "source=youtube" >> "$GITHUB_OUTPUT"
            echo "YT_TOKEN_JSON present -> scanning youtube"
          else
            echo "source=corpus" >> "$GITHUB_OUTPUT"
            echo "YT_TOKEN_JSON absent -> falling back to corpus"
          fi

      - name: Scan
        # ALMANAC_WRITE is deliberately unset: the write guard in almanac/youtube.py keeps
        # videos.update dry-run unless it is true AND --apply was passed. Nothing here mutates
        # YouTube.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'claude-opus-5' }}
        run: python -m almanac scan --source "${{ steps.source.outputs.source }}" --out reports/

      - name: Commit and push
        run: |
          set -euo pipefail
          DATE="$(date -u +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # .gitignore re-includes exactly reports/latest.json and reports/<YYYY-MM-DD>.md;
          # `git add reports/` therefore cannot pick up latest.md, the dated .json, or any
          # ad-hoc scan output sitting in the directory.
          git add facts/rates.json reports/
          if git diff --cached --quiet; then
            echo "nothing changed — not committing"
            exit 0
          fi
          git commit -m "almanac: nightly scan ${DATE} [skip ci]"
          git push
