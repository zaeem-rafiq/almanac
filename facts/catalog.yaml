# Almanac fact catalog.
#
# RULE (Project Rules, "No invented facts"):
#   Every `source: manual` entry is supplied by Zaeem with an irs.gov / ssa.gov /
#   treasurydirect.gov URL. The agent may scaffold entries with `value: null`;
#   it may not fill values. Tests fail on null values and on URLs that don't return 200.
#
# ---------------------------------------------------------------------------
# ZAEEM — fill the 11 `source: manual` entries below. For each one:
#     value:          the 2026 figure
#     effective_from: the date the 2026 figure took effect (usually 2026-01-01)
#     source_url:     the irs.gov / ssa.gov / treasurydirect.gov page showing it
#     history[0]:     the 2025 figure with its own effective_from / effective_to / source_url
# Leave every `source: rates` entry alone — `python -m almanac rates --refresh` fills those.
# ---------------------------------------------------------------------------

