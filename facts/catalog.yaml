# Almanac fact catalog.
#
# RULE (Project Rules, "No invented facts"):
#   Every `source: manual` entry is supplied by Zaeem with an irs.gov / ssa.gov /
#   treasurydirect.gov URL. The agent may scaffold entries with `value: null`;
#   it may not fill values. Tests fail on null values and on URLs that don't return 200.
#
# Scaffolded in A-00 with every value null. Zaeem fills `value`, `source_url`,
# `effective_from`, and `effective_to` in A-01, after which this file is protected.
#
# `source: rates` entries are populated by `python -m almanac rates --refresh`
# (catalog.refresh_rates() -> facts/rates.json). Their `max_age_days` is derived in A-01
# from the cadence observed by scripts/preflight.py, not assumed (see ADR-000 KTD3/5b).

entities:
  # ---- source: rates (written by rates --refresh; never hand-edited) ----
